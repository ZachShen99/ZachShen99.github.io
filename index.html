<style>
:root {
  --bg: #fbfbfd;
  --bg2: #f5f5f7;
  --text: #1d1d1f;
  --dim: #86868b;
  --line: #d2d2d7;
  --accent: #0071e3;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --bg2: #161617; --text: #f5f5f7; --dim: #86868b; --line: #424245; --accent: #2997ff; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }

/* every text exists twice; show the active language only */
html[data-lang="zh"] [lang="en"], html[data-lang="en"] [lang="zh"] { display: none !important; }

.wrap { width: min(980px, 100% - 48px); margin: 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* nav */
nav { position: fixed; inset: 0 0 auto; z-index: 10; height: 52px; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid transparent; transition: border-color .3s; }
nav.scrolled { border-bottom-color: var(--line); }
nav .wrap { height: 100%; display: flex; align-items: center; gap: 28px; font-size: 13px; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.links { display: flex; gap: 28px; margin-left: auto; }
.links a, .lang { color: var(--dim); transition: color .2s; }
.links a:hover, .links a.on, .lang:hover { color: var(--text); }
.lang { background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }

/* hero: sticky, shrinks and fades while you scroll away */
.hero { height: 140vh; position: relative; }
.hero-in { --d: clamp(200px, min(44vw, 46vh), 400px); position: sticky; top: 0; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-content: center; text-align: center; padding: 0 24px; will-change: transform, opacity; }
h1 { margin: 0; font-size: clamp(56px, 12vw, 148px); line-height: 1.02; font-weight: 700; letter-spacing: -.045em; }
.avatar { position: relative; width: var(--d); aspect-ratio: 1; margin: 0 auto; animation: avatarin 1s .05s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes avatarin { from { opacity: 0; transform: translateY(5%) scale(.9); } to { opacity: 1; transform: none; } }
.avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
#avatarCv { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
.hello { font-size: clamp(19px, 2.6vw, 28px); font-weight: 600; margin: 0 0 8px; color: var(--dim); }
.hint { position: absolute; left: 50%; bottom: 36px; width: 22px; height: 22px; margin-left: -11px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(45deg); animation: bob 2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(8px) rotate(45deg); } }


/* the name: handwritten, Vice City neon (font: Mr Dafoe, SIL OFL, subset to the letters of the name and "zach's homepage") */
@font-face { font-family: "Vice"; src: url(fonts/mr-dafoe-zach.woff2) format("woff2"); font-display: swap; unicode-range: U+20, U+27, U+41, U+43, U+48, U+5a, U+61, U+63, U+65, U+67-68, U+6d, U+6f-70, U+73, U+7a; }
.vice { font-family: "Vice", "Mr Dafoe", "Brush Script MT", "Segoe Script", cursive; font-weight: 400; letter-spacing: 0; text-transform: none;
  background: linear-gradient(180deg, #ff5fb0 12%, #ff9a62 88%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(.035em .035em 0 #00e5ff) drop-shadow(0 0 .12em rgba(255, 46, 147, .65)); }
/* the big name is drawn stroke by stroke, like the Vice City title: z, a, c, h, then a line underneath */
h1.sig { --w: clamp(280px, min(74vw, 80vh), 720px); width: var(--w); font-size: calc(var(--w) / 22); margin: calc(var(--d) * -.4) auto 4px; line-height: 0;
  filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 .8em rgba(255, 46, 147, .65)); animation: signflicker .55s 1s, signeon 4.5s ease-in-out 1.6s infinite alternate; }
h1.sig svg { display: block; width: 100%; height: auto; overflow: visible; }
.sig text { font-family: "Vice", "Mr Dafoe", "Brush Script MT", "Segoe Script", cursive; }
.sig .mk { stroke-dasharray: 1 2; stroke-dashoffset: 1.04; animation: sigdraw var(--d) var(--t) cubic-bezier(.5, .1, .3, 1) both; }
.sig .glint { transform: translateX(0) skewX(-18deg); animation: sigglint .55s 1.02s ease-in-out both; }
.js .sig:not(.go), .js .sig:not(.go) .mk, .js .sig:not(.go) .glint { animation-play-state: paused; }
@keyframes sigglint { from { transform: translateX(0) skewX(-18deg); } to { transform: translateX(1150px) skewX(-18deg); } }
@keyframes signflicker {
  0%   { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 .1em rgba(255, 46, 147, .15)); }
  14%  { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 1.7em rgba(255, 46, 147, .95)); }
  27%  { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 .1em rgba(255, 46, 147, .2)); }
  44%  { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 1.5em rgba(255, 46, 147, .9)); }
  58%  { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 .35em rgba(255, 46, 147, .4)); }
  100% { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 .8em rgba(255, 46, 147, .65)); }
}
@keyframes sigdraw { from { stroke-dashoffset: 1.04; } to { stroke-dashoffset: 0; } }
@keyframes signeon {
  from { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 .5em rgba(255, 46, 147, .5)); }
  to   { filter: drop-shadow(.28em .28em 0 #00e5ff) drop-shadow(0 0 1.4em rgba(255, 46, 147, .85)); }
}
.brand.vice { font-size: 28px; white-space: nowrap; line-height: 1; padding: 0 .1em .08em 0; }
.hero-in::before { content: ""; position: absolute; inset: 12% 8%; z-index: -1; pointer-events: none; filter: blur(40px);
  background: radial-gradient(closest-side at 32% 55%, rgba(255, 46, 147, .22), transparent 70%), radial-gradient(closest-side at 70% 48%, rgba(0, 229, 255, .16), transparent 70%); }

/* terminal */
.term-sec { position: relative; height: calc(100vh + 5 * 60vh); }
.term-stick { position: sticky; top: 52px; height: calc(100vh - 52px); display: flex; align-items: center; }
.term-stick .wrap { width: min(1040px, 100% - 32px); }
html:not(.js) .term-sec { display: none; }
.term { --fg: #e6e6e6; --acc: #33ff66; --glow: 0; position: relative; border-radius: 14px; background: rgba(11, 13, 16, .92); border: 1px solid #2a2e35; overflow: hidden; color: var(--fg);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45), 0 0 calc(70px * var(--glow)) color-mix(in srgb, var(--acc) 26%, transparent); transform-origin: 50% 80%; will-change: transform, opacity;
  font: 14px/1.55 ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
.term-bar { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: #15181d; border-bottom: 1px solid #2a2e35; }
.term-bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.term-bar i:nth-child(2) { background: #febc2e; }
.term-bar i:nth-child(3) { background: #28c840; }
.term-bar span { flex: 1; text-align: center; color: #8b929c; font-size: 12.5px; margin-right: 44px; }
.term-body { position: relative; height: clamp(300px, calc(100vh - 52px - 41px - 120px), 640px); overflow-y: auto; overflow-x: hidden; padding: 14px 16px 18px; cursor: text; text-shadow: 0 0 6px color-mix(in srgb, var(--fg) 35%, transparent); scrollbar-width: thin; scrollbar-color: #2a2e35 transparent; }
.term::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); }
.ln { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; }
.ln a { text-decoration: underline; text-underline-offset: 3px; }
.ln.ind { padding-left: 2ch; text-indent: -2ch; }
.g { color: var(--acc); } .b { color: #6cb6ff; font-weight: 700; } .c { color: #56d4dd; } .y { color: #e5c07b; } .r { color: #ff6b6b; } .m { color: #d291ff; } .d { color: #7d8590; }
.term-line { display: flex; align-items: baseline; }
#termPs { white-space: pre; }
#termIn { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-shadow: inherit; caret-color: var(--acc); caret-shape: block; }
.term.busy .term-line { opacity: .35; }
.nf { display: flex; gap: 22px; margin: 4px 0; flex-wrap: wrap; }
.art { font-size: 11px; line-height: 1; letter-spacing: 0; white-space: pre; flex: none; }
.art div { height: 1em; white-space: pre; }
.nf-info { min-width: 0; align-self: center; }
#termFx { position: absolute; left: 0; width: 100%; pointer-events: none; }
.term.glitch { animation: glitch .6s steps(2, end); }
@keyframes glitch {
  0% { transform: translate(0); filter: none; } 15% { transform: translate(-4px, 1px); filter: hue-rotate(90deg) saturate(2); }
  30% { transform: translate(5px, -2px); filter: hue-rotate(-60deg); } 45% { transform: translate(-3px, 0); filter: invert(.15); }
  60% { transform: translate(2px, 2px); filter: hue-rotate(160deg); } 100% { transform: translate(0); filter: none; }
}
.dots { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: var(--line); cursor: pointer; transition: width .3s, background .3s; }
.dots button:hover { background: var(--dim); }
.dots button.on { width: 26px; background: #33ff66; }
/* the toy Tk window that "wish" opens inside the terminal (classic grey look) */
.tkwin { position: absolute; z-index: 4; min-width: 200px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); overflow: auto; background: #d9d9d9; color: #000; border: 1px solid #555; box-shadow: 0 12px 34px rgba(0, 0, 0, .55); font: 13px/1.3 Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; text-shadow: none; }
.tkbar { display: flex; align-items: center; justify-content: space-between; padding: 3px 4px 3px 9px; background: linear-gradient(#5b7fb4, #34548a); color: #fff; font-weight: 600; cursor: move; user-select: none; touch-action: none; }
.tkx { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 3px; background: rgba(255, 255, 255, .18); color: #fff; font: 16px/18px Arial, sans-serif; cursor: pointer; }
.tkx:hover { background: #d9534f; }
.tkbody { position: relative; display: flex; flex-direction: column; padding: 10px; min-height: 40px; touch-action: none; }
.tkbody * { box-sizing: border-box; }
.tk-label { padding: 2px 4px; white-space: pre-wrap; }
.tk-button { font: inherit; padding: 3px 10px; background: #ececec; color: #000; border: 1px solid #888; border-radius: 2px; cursor: pointer; box-shadow: inset 1px 1px #fff; }
.tk-button:active { background: #c8c8c8; box-shadow: inset 1px 1px #888; }
.tk-button:disabled { color: #888; cursor: default; }
.tk-entry { font: inherit; background: #fff; color: #000; border: 2px inset #aaa; padding: 2px 4px; min-width: 0; }
.tk-check { display: flex; align-items: center; gap: 6px; }
.tk-scale { display: flex; align-items: center; gap: 8px; }
.tk-scale input { width: 160px; }
.tk-scale input.vert { writing-mode: vertical-lr; direction: rtl; width: auto; height: 120px; }
.tk-frame { min-width: 4px; min-height: 4px; }
.tkbody [data-relief="groove"], .tkbody [data-relief="ridge"] { border: 2px groove #aaa; }
.tkbody [data-relief="sunken"] { border: 2px inset #aaa; }
.tkbody [data-relief="raised"] { border: 2px outset #eee; }
.tkbody [data-relief="solid"] { border: 1px solid #000; }
.tk-labelframe { border: 2px groove #aaa; padding: 6px 8px 8px; margin: 0; min-width: 0; }
.tk-labelframe legend { padding: 0 4px; }
.tk-canvas { display: block; background: #fff; border: 1px solid #888; touch-action: none; }
.tk-modal { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(0, 0, 0, .3); }
.tk-modal-card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 20px; background: #d9d9d9; border: 1px solid #555; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.term-hint { text-align: center; color: var(--dim); font-size: 14px; margin: 10px 0 0; }
.term-hint code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; background: var(--bg2); padding: 2px 7px; border-radius: 6px; color: var(--text); }
@media (min-width: 900px) { .term { font-size: 16px; } .art { font-size: 12px; } }
@media (max-width: 760px) { .term { font-size: 12.5px; } .art { font-size: 8.5px; } .term-body { padding: 12px 12px 14px; } }

footer { position: relative; border-top: 1px solid var(--line); padding: 20px 0 28px; color: var(--dim); font-size: 12px; }

@media (max-width: 760px) {
  .links { display: none; }
  .lang { margin-left: auto; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hint, h1.sig, .avatar { animation: none; }
  .sig .mk { animation: none; stroke-dashoffset: 0; }
  .sig .glint { animation: none; opacity: 0; }
}
</style>
</head>

<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("lang");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* start the signature once the font is there, so it is never drawn in a fallback face */
  var sig = document.getElementById("sig");
  function startSig() { sig.classList.add("go"); }
  if (document.fonts && document.fonts.load) {
    Promise.race([document.fonts.load("400 100px Vice", "Zach"), new Promise(function (r) { setTimeout(r, 1500); })]).then(startSig, startSig);
  } else startSig();

  /* language */
  function set(lang) {
    root.dataset.lang = lang;
    root.lang = lang === "zh" ? "zh-CN" : "en";
    btn.textContent = lang === "zh" ? "English" : "中文";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    update();
  }
  var saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  var q = new URLSearchParams(location.search).get("lang");
  var initial = q === "en" || q === "zh" ? q : saved || ((navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en");

  var nav = document.getElementById("nav"), heroIn = document.getElementById("heroIn");
  var ticking = false, avatarFrame = null;

  function update() {
    ticking = false;
    var vh = window.innerHeight, y = window.scrollY;
    nav.classList.toggle("scrolled", y > 8);

    if (!reduce) {
      if (avatarFrame) avatarFrame(Math.min(1, y / (vh * 0.7)));
      var p = Math.min(1, Math.max(0, y / (vh * 0.8)));
      heroIn.style.opacity = String(1 - p * 1.15 < 0 ? 0 : 1 - p * 1.15);
      heroIn.style.transform = "scale(" + (1 - p * 0.18) + ")";
    }
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);

  btn.addEventListener("click", function () { set(root.dataset.lang === "zh" ? "en" : "zh"); });
  set(initial);

  /* Avatar explosion + particle network. While the hero scrolls away, the avatar bursts into
     particles; a few of them survive, drift around the page and link up with lines when they come
     close, and the mouse links to nearby ones. The maths and drawing run in WebAssembly
     (wasm/avatar.wasm, source in wasm/src/lib.rs). If anything fails, the plain <img> stays. */
  (function () {
    if (reduce || !window.WebAssembly) return;
    var cv = document.getElementById("avatarCv"), img = document.querySelector("#avatar img");
    fetch("wasm/avatar.wasm").then(function (r) { return r.arrayBuffer(); })
      .then(function (b) { return WebAssembly.instantiate(b, {}); })
      .then(function (res) {
        var x = res.instance.exports;
        return (img.decode ? img.decode() : Promise.resolve()).then(function () { return x; });
      })
      .then(function (x) {
        var G = x.grid(), N = G * G;
        var off = document.createElement("canvas"); off.width = off.height = G;
        var octx = off.getContext("2d");
        octx.drawImage(img, 0, 0, G, G);
        var px = octx.getImageData(0, 0, G, G).data, c = (G - 1) / 2;
        for (var i = 0; i < N; i++) {                      /* keep a circle, drop the corners */
          var dx = i % G - c, dy = Math.floor(i / G) - c;
          px[i * 4 + 3] = dx * dx + dy * dy <= (G / 2) * (G / 2) && px[i * 4 + 3] > 127 ? 255 : 0;
        }
        x.init();
        new Uint8ClampedArray(x.memory.buffer, x.colors_ptr(), N * 4).set(px);
        x.setup();

        var ctx = cv.getContext("2d"), W = 0, H = 0, sc = 1, frameData = null;
        function size() {
          sc = Math.min(window.devicePixelRatio || 1, 2, x.max_width() / window.innerWidth, x.max_height() / window.innerHeight);
          W = Math.round(window.innerWidth * sc); H = Math.round(window.innerHeight * sc);
          cv.width = W; cv.height = H; last = 0;           /* resizing clears the canvas: redraw at once */
          frameData = new ImageData(new Uint8ClampedArray(x.memory.buffer, x.fb_ptr(), W * H * 4), W, H);
        }
        size();
        window.addEventListener("resize", size);

        var mx = -1e4, my = -1e4, t = 0, looping = false, last = 0;
        window.addEventListener("pointermove", function (e) { mx = e.clientX * sc; my = e.clientY * sc; }, { passive: true });
        window.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") mx = my = -1e4; }, { passive: true });
        document.addEventListener("mouseleave", function () { mx = my = -1e4; });
        window.addEventListener("blur", function () { mx = my = -1e4; });

        function draw(now) {
          if (t <= 0) { looping = false; return; }
          requestAnimationFrame(draw);
          var gap = now - last;
          if (gap < (t >= 1 ? 22 : 12)) return;            /* ~45 fps once only the network is left */
          last = now;
          x.net_step(t, W, H, Math.min(3, gap / 16.67), sc);
          var r = img.getBoundingClientRect();
          x.render(t, W, H, (r.left + r.width / 2) * sc, (r.top + r.height / 2) * sc, r.width * sc, mx, my, sc);
          ctx.putImageData(frameData, 0, 0);
        }

        avatarFrame = function (p) {
          t = p;
          if (p <= 0) { cv.hidden = true; img.style.opacity = "1"; return; }
          var f = Math.min(1, p / 0.04);                   /* crossfade <img> -> particles */
          cv.style.opacity = String(f); img.style.opacity = String(1 - f);
          cv.hidden = false;
          if (!looping) { looping = true; requestAnimationFrame(draw); }
        };
        update();
      })
      .catch(function () { /* keep the static image */ });
  })();
})();
</script>
<script src="terminal.js" defer></script>
